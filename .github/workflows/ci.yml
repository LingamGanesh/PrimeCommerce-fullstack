name: CI

on:
  push:
    branches:
      - main
      - audit/fix-repository
      - fix/full-repository-audit
  pull_request:
    branches:
      - main
      - feat/blinkit-inspired-design

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and MongoDB startup smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 8080
      MONGODB_URI: mongodb://127.0.0.1:27017/primecommerce_ci
      SECRET_KEY_ACCESS_TOKEN: ci-access-secret-not-for-production
      SECRET_KEY_REFRESH_TOKEN: ci-refresh-secret-not-for-production
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Verify backend starts and connects to MongoDB
        run: |
          npm start > /tmp/primecommerce-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/; then
              echo
              echo "Backend health endpoint responded successfully."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/primecommerce-server.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/primecommerce-server.log
          echo "Backend did not become healthy within 60 seconds."
          exit 1

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
