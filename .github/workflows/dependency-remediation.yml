name: Compatible dependency remediation

on:
  push:
    branches: [fix/full-repository-audit]
    paths:
      - "server/package.json"
      - "server/package-lock.json"
      - "client/package.json"
      - "client/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-repository-audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatible backend dependency fixes
        working-directory: server
        run: npm audit fix
      - name: Apply compatible frontend dependency fixes
        working-directory: client
        run: npm audit fix
      - name: Require no high or critical backend advisories
        working-directory: server
        run: npm audit --audit-level=high
      - name: Require no high or critical frontend advisories
        working-directory: client
        run: npm audit --audit-level=high
      - name: Run backend regression tests
        working-directory: server
        run: npm ci && npm test
      - name: Run frontend lint and production build
        working-directory: client
        run: npm ci && npm run lint && npm run build
      - name: Commit compatible lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- server/package.json server/package-lock.json client/package.json client/package-lock.json; then
            git add server/package.json server/package-lock.json client/package.json client/package-lock.json
            git commit -m "security(deps): apply compatible npm audit fixes"
            git push origin HEAD:fix/full-repository-audit
          else
            echo "No dependency changes were required."
          fi