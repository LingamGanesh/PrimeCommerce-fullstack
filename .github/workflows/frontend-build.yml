name: Frontend and backend checks

on:
  push:
    branches:
      - feat/blinkit-inspired-design
      - fix/full-repository-audit
  pull_request:
    branches:
      - feat/quick-commerce-foundation
      - feat/blinkit-inspired-design
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'direct='+v.isDirect, 'range='+v.range, 'fix='+JSON.stringify(v.fixAvailable), 'via='+v.via.map(x => typeof x === 'string' ? x : x.title).join('; '))"

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'direct='+v.isDirect, 'range='+v.range, 'fix='+JSON.stringify(v.fixAvailable), 'via='+v.via.map(x => typeof x === 'string' ? x : x.title).join('; '))"

      - name: Run backend tests
        run: npm test
